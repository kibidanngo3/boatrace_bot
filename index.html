<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boatrace Bot 成績</title>
<style>
  :root {
    --bg: #0f1218; --card: #181d26; --line: #262d3a;
    --fg: #e7ecf3; --muted: #94a3b8;
    --up: #34d399; --down: #f87171; --accent: #60a5fa;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fb; --card: #fff; --line: #e3e8ef;
      --fg: #111827; --muted: #6b7280;
      --up: #059669; --down: #dc2626; --accent: #2563eb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  section { margin-bottom: 24px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 520px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; text-align: right; position: sticky; top: 0; background: var(--card); }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:hover { background: rgba(96,165,250,.06); }
  .num { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.hit { background: rgba(52,211,153,.15); color: var(--up); }
  .pill.miss { background: rgba(148,163,184,.15); color: var(--muted); }
  svg { display: block; width: 100%; height: 220px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .tickets { color: var(--muted); font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<h1>🚤 Boatrace Bot 成績</h1>
<div class="sub" id="sub"></div>
<div id="app"></div>

<script>
const D = {"overall": {"n": 10, "hits": 1, "hit_rate": 10.0, "stake": 3500, "return": 5060, "profit": 1560, "roi": 144.57142857142858}, "maxDd": 2900, "curve": [{"label": "08/03 下関11R", "value": 9700, "hit": false}, {"label": "08/03 若松12R", "value": 9400, "hit": false}, {"label": "08/04 三国6R", "value": 9100, "hit": false}, {"label": "08/04 三国7R", "value": 8700, "hit": false}, {"label": "08/04 宮島2R", "value": 8300, "hit": false}, {"label": "08/04 多摩川1R", "value": 7800, "hit": false}, {"label": "08/04 三国8R", "value": 7300, "hit": false}, {"label": "08/04 宮島3R", "value": 7100, "hit": false}, {"label": "08/04 平和島1R", "value": 11960, "hit": true}, {"label": "08/04 平和島2R", "value": 11560, "hit": false}], "byCourse": [{"n": 2, "hits": 1, "hit_rate": 50.0, "stake": 600, "return": 5060, "profit": 4460, "roi": 843.3333333333334, "key": "平和島"}, {"n": 1, "hits": 0, "hit_rate": 0.0, "stake": 300, "return": 0, "profit": -300, "roi": 0.0, "key": "下関"}, {"n": 1, "hits": 0, "hit_rate": 0.0, "stake": 300, "return": 0, "profit": -300, "roi": 0.0, "key": "若松"}, {"n": 1, "hits": 0, "hit_rate": 0.0, "stake": 500, "return": 0, "profit": -500, "roi": 0.0, "key": "多摩川"}, {"n": 2, "hits": 0, "hit_rate": 0.0, "stake": 600, "return": 0, "profit": -600, "roi": 0.0, "key": "宮島"}, {"n": 3, "hits": 0, "hit_rate": 0.0, "stake": 1200, "return": 0, "profit": -1200, "roi": 0.0, "key": "三国"}], "byStrategy": [{"n": 4, "hits": 1, "hit_rate": 25.0, "stake": 1400, "return": 5060, "profit": 3660, "roi": 361.42857142857144, "key": "FOCUS"}, {"n": 6, "hits": 0, "hit_rate": 0.0, "stake": 2100, "return": 0, "profit": -2100, "roi": 0.0, "key": "STANDARD"}], "byDate": [{"n": 8, "hits": 1, "hit_rate": 12.5, "stake": 2900, "return": 5060, "profit": 2160, "roi": 174.48275862068965, "key": "20260804"}, {"n": 2, "hits": 0, "hit_rate": 0.0, "stake": 600, "return": 0, "profit": -600, "roi": 0.0, "key": "20260803"}], "history": [{"date": "20260804", "course": "平和島", "rno": "2", "strategy": "STANDARD", "tickets": "3-4-5(172.8倍/EV4.05/¥100) / 3-5-1(105.5倍/EV3.07/¥100) / 3-4-1(74.0倍/EV2.98/¥100) / 3-1-5(46.6倍/EV1.85/¥100)", "result": "4-2-3", "payout": 35930, "hit": false, "stake": 400, "ret": 0, "profit": -400}, {"date": "20260804", "course": "平和島", "rno": "1", "strategy": "FOCUS", "tickets": "3-4-5(56.8倍/EV3.18/¥100) / 3-4-2(48.8倍/EV3.01/¥100)", "result": "3-4-5", "payout": 5060, "hit": true, "stake": 200, "ret": 5060, "profit": 4860}, {"date": "20260804", "course": "宮島", "rno": "3", "strategy": "STANDARD", "tickets": "3-4-5(147.3倍/EV4.71/¥100) / 3-4-1(73.6倍/EV2.73/¥100)", "result": "3-1-6", "payout": 7020, "hit": false, "stake": 200, "ret": 0, "profit": -200}, {"date": "20260804", "course": "三国", "rno": "8", "strategy": "FOCUS", "tickets": "3-4-1(33.4倍/EV3.91/¥200) / 3-4-2(57.6倍/EV3.80/¥100) / 3-1-2(76.9倍/EV3.64/¥100) / 3-4-5(37.3倍/EV2.90/¥100)", "result": "3-1-6", "payout": 2100, "hit": false, "stake": 500, "ret": 0, "profit": -500}, {"date": "20260804", "course": "多摩川", "rno": "1", "strategy": "STANDARD", "tickets": "3-4-5(364.2倍/EV10.53/¥100) / 3-1-5(95.0倍/EV4.64/¥100) / 3-1-2(100.4倍/EV4.14/¥100) / 3-4-1(124.8倍/EV3.58/¥100) / 3-1-6(90.1倍/EV3.20/¥100)", "result": "4-1-6", "payout": 2650, "hit": false, "stake": 500, "ret": 0, "profit": -500}, {"date": "20260804", "course": "宮島", "rno": "2", "strategy": "STANDARD", "tickets": "3-4-1(218.1倍/EV7.08/¥100) / 3-1-2(110.4倍/EV7.07/¥100) / 3-4-5(214.5倍/EV5.55/¥100) / 3-1-5(95.1倍/EV3.60/¥100)", "result": "2-3-1", "payout": 14790, "hit": false, "stake": 400, "ret": 0, "profit": -400}, {"date": "20260804", "course": "三国", "rno": "7", "strategy": "FOCUS", "tickets": "3-4-5(489.2倍/EV32.88/¥100) / 3-4-1(249.9倍/EV15.37/¥100) / 3-4-6(291.0倍/EV8.99/¥100) / 3-1-5(223.2倍/EV7.08/¥100)", "result": "4-5-3", "payout": 18550, "hit": false, "stake": 400, "ret": 0, "profit": -400}, {"date": "20260804", "course": "三国", "rno": "6", "strategy": "STANDARD", "tickets": "2-4-3(127.7倍/EV3.66/¥100) / 3-4-2(87.6倍/EV3.47/¥100) / 3-4-1(81.2倍/EV3.46/¥100)", "result": "2-3-4", "payout": 12130, "hit": false, "stake": 300, "ret": 0, "profit": -300}, {"date": "20260803", "course": "若松", "rno": "12", "strategy": "STANDARD", "tickets": "3-4-1(192.8倍/EV13.49/¥200) / 3-4-5(271.2倍/EV8.62/¥100)", "result": "1-3-2", "payout": 650, "hit": false, "stake": 300, "ret": 0, "profit": -300}, {"date": "20260803", "course": "下関", "rno": "11", "strategy": "FOCUS", "tickets": "3-4-5(258.2倍/EV13.22/¥100) / 3-4-2(210.2倍/EV9.17/¥100) / 3-4-1(125.9倍/EV8.01/¥100)", "result": "3-6-1", "payout": 3450, "hit": false, "stake": 300, "ret": 0, "profit": -300}], "generatedAt": "2026-08-04 12:50"};

const yen = n => (n < 0 ? "-" : "") + "¥" + Math.abs(n).toLocaleString();
const signed = n => (n >= 0 ? "+" : "-") + "¥" + Math.abs(n).toLocaleString();
const cls = n => n >= 0 ? "up" : "down";

document.getElementById("sub").textContent = "最終更新 " + D.generatedAt + "（決着済 " + D.overall.n + " レース）";

if (D.overall.n === 0) {
  document.getElementById("app").innerHTML = '<div class="empty">まだ決着したレースがありません。</div>';
} else {
  const o = D.overall;
  const cards = `
    <div class="grid">
      <div class="card"><div class="label">収支</div><div class="value ${cls(o.profit)}">${signed(o.profit)}</div></div>
      <div class="card"><div class="label">回収率</div><div class="value ${o.roi >= 100 ? "up" : "down"}">${o.roi.toFixed(1)}%</div></div>
      <div class="card"><div class="label">的中率</div><div class="value">${o.hit_rate.toFixed(1)}%<span style="font-size:13px;color:var(--muted)"> (${o.hits}/${o.n})</span></div></div>
      <div class="card"><div class="label">投資 / 払戻</div><div class="value" style="font-size:16px">${yen(o.stake)} / ${yen(o.return)}</div></div>
      <div class="card"><div class="label">最大ドローダウン</div><div class="value down">${yen(D.maxDd)}</div></div>
    </div>`;

  // 資金推移(自前SVG。外部ライブラリ不要)
  const c = D.curve;
  const W = 800, H = 220, P = 34;
  const vals = c.map(p => p.value);
  const lo = Math.min(...vals, 10000), hi = Math.max(...vals, 10000);
  const pad = (hi - lo) * 0.12 || 1000;
  const yMin = lo - pad, yMax = hi + pad;
  const x = i => P + (W - P * 2) * (c.length === 1 ? 0.5 : i / (c.length - 1));
  const y = v => H - P - (H - P * 2) * ((v - yMin) / (yMax - yMin));
  const line = c.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = line + ` L${x(c.length - 1).toFixed(1)},${y(yMin)} L${x(0).toFixed(1)},${y(yMin)} Z`;
  const base = y(10000);
  const dots = c.filter(p => p.hit).map((p, _i) => {
    const i = c.indexOf(p);
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.5" fill="var(--up)"><title>${p.label}</title></circle>`;
  }).join("");
  const chart = `
    <section>
      <h2>資金推移（元手 ¥10,000 / 緑点は的中）</h2>
      <div class="card">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient></defs>
          <line x1="${P}" y1="${base}" x2="${W - P}" y2="${base}" stroke="var(--line)" stroke-dasharray="4 4"/>
          <text x="${P}" y="${base - 6}" fill="var(--muted)" font-size="11">元手 ¥10,000</text>
          <path d="${area}" fill="url(#g)"/>
          <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
          ${dots}
          <text x="${P}" y="16" fill="var(--muted)" font-size="11">${yen(Math.round(yMax))}</text>
          <text x="${P}" y="${H - 8}" fill="var(--muted)" font-size="11">${yen(Math.round(yMin))}</text>
        </svg>
      </div>
    </section>`;

  const table = (title, rows, keyLabel) => `
    <section>
      <h2>${title}</h2>
      <div class="card scroll">
        <table>
          <thead><tr>
            <th>${keyLabel}</th><th>賭数</th><th>的中</th><th>的中率</th><th>投資</th><th>払戻</th><th>収支</th><th>回収率</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.key}</td>
                <td class="num">${r.n}</td>
                <td class="num">${r.hits}</td>
                <td class="num">${r.hit_rate.toFixed(1)}%</td>
                <td class="num">${yen(r.stake)}</td>
                <td class="num">${yen(r.return)}</td>
                <td class="num ${cls(r.profit)}">${signed(r.profit)}</td>
                <td class="num ${r.roi >= 100 ? "up" : "down"}">${r.roi.toFixed(0)}%</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>`;

  const history = `
    <section>
      <h2>全履歴（新しい順）</h2>
      <div class="card scroll">
        <table>
          <thead><tr>
            <th>日付</th><th>レース</th><th>戦略</th><th>買い目</th><th>結果</th><th>払戻</th><th>収支</th><th></th>
          </tr></thead>
          <tbody>
            ${D.history.map(h => `
              <tr>
                <td class="num">${h.date.slice(4,6)}/${h.date.slice(6,8)}</td>
                <td>${h.course} ${h.rno}R</td>
                <td>${h.strategy}</td>
                <td class="tickets">${h.tickets}</td>
                <td class="num">${h.result}</td>
                <td class="num">${h.payout ? yen(h.payout) : "-"}</td>
                <td class="num ${cls(h.profit)}">${signed(h.profit)}</td>
                <td><span class="pill ${h.hit ? "hit" : "miss"}">${h.hit ? "的中" : "-"}</span></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>`;

  document.getElementById("app").innerHTML =
    cards + chart +
    table("日別", D.byDate, "日付") +
    table("会場別", D.byCourse, "会場") +
    table("戦略別", D.byStrategy, "戦略") +
    history;
}
</script>
</body>
</html>
